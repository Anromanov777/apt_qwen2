{% extends 'base.html' %}

{% block title %}Корзина{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <h2 class="fw-bold mb-4">🛒 Корзина</h2>
        
        <div class="row">
            <!-- Cart Items -->
            <div class="col-lg-8">
                <div id="cart-items">
                    <!-- Заполняется через JS -->
                </div>
                <div id="cart-empty" class="text-center py-5 d-none">
                    <span class="fs-1">🛒</span>
                    <h4 class="mt-3">Корзина пуста</h4>
                    <p class="text-muted">Добавьте что-нибудь вкусное из нашего меню!</p>
                    <a href="/menu/" class="btn btn-primary-custom btn-lg rounded-pill">Перейти в меню</a>
                </div>
            </div>
            
            <!-- Order Summary -->
            <div class="col-lg-4">
                <div class="card shadow-sm rounded-4 p-4" id="order-summary">
                    <h5 class="fw-bold mb-3">Ваш заказ</h5>
                    <div id="summary-items" class="mb-3">
                        <!-- Заполняется через JS -->
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Подытог:</span>
                        <span id="subtotal">0 ₽</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Доставка:</span>
                        <span id="delivery-cost">0 ₽</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="fw-bold fs-5">Итого:</span>
                        <span class="fw-bold fs-5 text-danger" id="total">0 ₽</span>
                    </div>
                    <a href="/checkout/" class="btn btn-primary-custom btn-lg w-100 rounded-pill" id="checkout-btn">
                        Оформить заказ
                    </a>
                    <button class="btn btn-outline-danger btn-sm w-100 mt-2" id="clear-cart-btn">
                        Очистить корзину
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
function renderCart() {
    const cart = JSON.parse(localStorage.getItem('cart') || '{}');
    const items = Object.entries(cart);
    const cartItemsEl = document.getElementById('cart-items');
    const cartEmptyEl = document.getElementById('cart-empty');
    const summaryItemsEl = document.getElementById('summary-items');
    
    if (items.length === 0) {
        cartItemsEl.innerHTML = '';
        cartEmptyEl.classList.remove('d-none');
        document.getElementById('order-summary').classList.add('d-none');
        return;
    }
    
    cartEmptyEl.classList.add('d-none');
    document.getElementById('order-summary').classList.remove('d-none');
    
    let html = '';
    let summaryHtml = '';
    let subtotal = 0;
    
    items.forEach(([id, item]) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        
        html += `
            <div class="card mb-3 shadow-sm">
                <div class="card-body d-flex align-items-center">
                    <span class="fs-2 me-3">🍣</span>
                    <div class="flex-grow-1">
                        <h6 class="mb-0">${item.name}</h6>
                        <small class="text-muted">${item.price} ₽ × ${item.quantity}</small>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-sm btn-outline-secondary" onclick="changeQuantity('${id}', -1)">−</button>
                        <span class="fw-bold">${item.quantity}</span>
                        <button class="btn btn-sm btn-outline-secondary" onclick="changeQuantity('${id}', 1)">+</button>
                    </div>
                    <span class="fw-bold text-danger ms-3">${itemTotal} ₽</span>
                    <button class="btn btn-sm text-danger ms-2" onclick="removeItem('${id}')">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        `;
        
        summaryHtml += `<div class="d-flex justify-content-between small"><span>${item.name} ×${item.quantity}</span><span>${itemTotal} ₽</span></div>`;
    });
    
    cartItemsEl.innerHTML = html;
    summaryItemsEl.innerHTML = summaryHtml;
    
    const deliveryCost = subtotal >= 1000 ? 0 : 200;
    const total = subtotal + deliveryCost;
    
    document.getElementById('subtotal').textContent = subtotal + ' ₽';
    document.getElementById('delivery-cost').textContent = deliveryCost === 0 ? 'Бесплатно' : deliveryCost + ' ₽';
    document.getElementById('total').textContent = total + ' ₽';
}

function changeQuantity(productId, delta) {
    let cart = JSON.parse(localStorage.getItem('cart') || '{}');
    if (cart[productId]) {
        cart[productId].quantity += delta;
        if (cart[productId].quantity <= 0) {
            delete cart[productId];
        }
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
    updateCartBadge();
}

function removeItem(productId) {
    let cart = JSON.parse(localStorage.getItem('cart') || '{}');
    delete cart[productId];
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
    updateCartBadge();
}

function updateCartBadge() {
    const cart = JSON.parse(localStorage.getItem('cart') || '{}');
    const totalItems = Object.values(cart).reduce((sum, item) => sum + item.quantity, 0);
    const badge = document.getElementById('cart-count');
    if (totalItems > 0) {
        badge.textContent = totalItems;
        badge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
    }
}

document.getElementById('clear-cart-btn').addEventListener('click', function() {
    if (confirm('Очистить корзину?')) {
        localStorage.removeItem('cart');
        renderCart();
        updateCartBadge();
    }
});

renderCart();
</script>
{% endblock %}
